[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seven-seg-ocr"
version = "0.1.0"
description = "Blur-robust OCR for 7-segment LED/LCD displays — no ML, no GPU, pure NumPy+OpenCV"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Evgeny Pistun"},
]
keywords = ["ocr", "7-segment", "image-processing", "computer-vision", "led-display"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.21",
    "opencv-python-headless>=4.5",
    "Pillow>=9.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
seven-seg-ocr = "seven_seg_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/user/seven-seg-ocr"
Repository = "https://github.com/user/seven-seg-ocr"

[tool.hatch.build.targets.wheel]
packages = ["src/seven_seg_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src/seven_seg_ocr"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
